<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum library · MathHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem("mathhub.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body data-page="curriculum">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="topbar-title">
        <h1>Curriculum library</h1>
        <p class="muted">Units, topics and learning outcomes for every level, with how much you have planned and taught</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="exportBtn">Export</button>
        <button class="btn btn-ghost" id="importBtn">Import topics…</button>
        <button class="btn btn-primary" id="addUnit">+ Unit</button>
      </div>
    </header>
    <main class="content">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="toolbar">
        <div class="seg" id="trackSeg" role="group" aria-label="Level"></div>
        <input type="search" id="q" placeholder="Search topics and outcomes…" aria-label="Search" style="min-width:240px">
        <span class="grow"></span>
        <button class="btn btn-sm btn-ghost" id="expandAll">Expand all</button>
        <button class="btn btn-sm btn-ghost" id="collapseAll">Collapse all</button>
      </div>
      <div id="panel"></div>
    </main>
  </div>
</div>
<script src="assets/js/core.js"></script>
<script src="assets/js/curricula.js"></script>
<script src="assets/js/curriculum.js"></script>
</body>
</html>
